[pytest]
# Pytest configuration for High School Management System

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Coverage options
testpaths = tests

# Markers for test organization
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security-related tests
    performance: Performance tests
    slow: Slow running tests

# Ignore patterns
norecursedirs = .git .venv venv __pycache__ *.egg-info .pytest_cache

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
